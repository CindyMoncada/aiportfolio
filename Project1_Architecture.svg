<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" font-family="'IBM Plex Mono','SFMono-Regular',monospace" role="img" aria-label="Project 1 architecture: EU AI Act RAG advisor on Azure">
<style>
.t{font-family:'Karla','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;fill:#F0E7D8}
.s{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-size:11px;fill:#B9AC96}
.lbl{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-size:12px;fill:#C89A6B;letter-spacing:.04em}
.leg{font-family:'IBM Plex Mono','SFMono-Regular',monospace;font-size:11px;fill:#B9AC96}
</style>
<defs>
<marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7d766a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text class="lbl" x="40" y="26">EU AI Act RAG advisor · Azure</text>

<rect x="40" y="104" width="600" height="430" rx="16" fill="none" stroke="#C89A6B" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="4 5"/>
<text class="lbl" x="55" y="126" fill="#C89A6B">Sweden Central · EU data boundary</text>

<!-- User (external) -->
<rect x="470" y="38" width="150" height="52" rx="9" fill="#1b1712" stroke="#8a8578" stroke-opacity="0.8" stroke-width="1"/>
<text class="t" x="545" y="60" text-anchor="middle">User</text>
<text class="s" x="545" y="77" text-anchor="middle">asks a question</text>

<!-- Foundry agent (serving) -->
<rect x="470" y="134" width="150" height="58" rx="9" fill="#1e1811" stroke="#C89A6B" stroke-width="1"/>
<text class="t" x="545" y="157" text-anchor="middle">Foundry agent</text>
<text class="s" x="545" y="175" text-anchor="middle">gpt-5-mini</text>

<!-- Foundry IQ (serving) -->
<rect x="470" y="232" width="150" height="58" rx="9" fill="#1e1811" stroke="#C89A6B" stroke-width="1"/>
<text class="t" x="545" y="255" text-anchor="middle">Foundry IQ</text>
<text class="s" x="545" y="273" text-anchor="middle">agentic retrieval</text>

<!-- PDF (data) -->
<rect x="60" y="134" width="160" height="58" rx="9" fill="#1e1a10" stroke="#D9B26A" stroke-width="1"/>
<text class="t" x="140" y="157" text-anchor="middle">EU AI Act PDF</text>
<text class="s" x="140" y="175" text-anchor="middle">EUR-Lex source</text>

<!-- Blob (data) -->
<rect x="60" y="232" width="160" height="58" rx="9" fill="#1e1a10" stroke="#D9B26A" stroke-width="1"/>
<text class="t" x="140" y="255" text-anchor="middle">Blob storage</text>
<text class="s" x="140" y="273" text-anchor="middle">euaiactstorage</text>

<!-- Wizard (data) -->
<rect x="60" y="330" width="160" height="58" rx="9" fill="#1e1a10" stroke="#D9B26A" stroke-width="1"/>
<text class="t" x="140" y="353" text-anchor="middle">Import wizard</text>
<text class="s" x="140" y="371" text-anchor="middle">chunk + embed</text>

<!-- Embedding model (model) -->
<rect x="270" y="334" width="200" height="52" rx="9" fill="#171b15" stroke="#9FAE8E" stroke-width="1"/>
<text class="t" x="370" y="355" text-anchor="middle">Embedding model</text>
<text class="s" x="370" y="373" text-anchor="middle">text-embedding-3-small</text>

<!-- Index (data) -->
<rect x="245" y="434" width="190" height="60" rx="9" fill="#221d11" stroke="#D9B26A" stroke-width="1.4"/>
<text class="t" x="340" y="458" text-anchor="middle">AI Search index</text>
<text class="s" x="340" y="476" text-anchor="middle">euaiact · 361 chunks</text>

<!-- Arrows -->
<line x1="545" y1="92" x2="545" y2="132" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>
<line x1="545" y1="194" x2="545" y2="230" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>
<line x1="140" y1="194" x2="140" y2="230" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>
<line x1="140" y1="292" x2="140" y2="328" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>
<path d="M545 292 L545 464 L439 464" fill="none" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>
<path d="M140 390 L140 464 L241 464" fill="none" stroke="#7d766a" stroke-width="1.4" marker-end="url(#arw)"/>

<!-- Leaders (embedding used at ingest + query) -->
<line x1="220" y1="360" x2="268" y2="360" stroke="#9FAE8E" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="370" y1="388" x2="370" y2="432" stroke="#9FAE8E" stroke-opacity="0.7" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Legend -->
<rect x="60" y="552" width="12" height="12" rx="3" fill="none" stroke="#8a8578" stroke-width="1"/>
<text class="leg" x="80" y="562">External</text>
<rect x="165" y="552" width="12" height="12" rx="3" fill="none" stroke="#C89A6B" stroke-width="1"/>
<text class="leg" x="185" y="562">Serving</text>
<rect x="262" y="552" width="12" height="12" rx="3" fill="none" stroke="#D9B26A" stroke-width="1"/>
<text class="leg" x="282" y="562">Data + retrieval</text>
<rect x="410" y="552" width="12" height="12" rx="3" fill="none" stroke="#9FAE8E" stroke-width="1"/>
<text class="leg" x="430" y="562">Model</text>
</svg>
